name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: APK oluştur
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java (JDK) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Android platformunu ekle (yoksa)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor senkronize et
        run: npx cap sync android

      - name: Debug APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yı yayınla (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: roman-atolyesi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
